name=FauxmoAlexaConnector
version=1.0.0
author=Madhukar Temba
maintainer=Madhukar Temba
sentence=Alexa voice control integration library using FauxmoESP for IR-controlled devices
paragraph=Provides seamless integration between Amazon Alexa voice commands and IR-controlled devices using the FauxmoESP library. Automatically registers devices with Alexa, handles voice commands for device control, and manages device state changes. Supports dynamic device registration/unregistration and provides callback mechanisms for state change notifications. Requires WiFi connectivity and integrates with DeviceManager and IRManager for complete device control functionality.
category=Communication
url=https://github.com/madhukartemba/ir_hub
architectures=esp8266
depends=ESP8266WiFi, fauxmoESP, DeviceManager, IRManager, Log
