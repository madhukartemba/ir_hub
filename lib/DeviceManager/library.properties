name=DeviceManager
version=1.0.0
author=Madhukar Temba
maintainer=Madhukar Temba
sentence=Device management library for storing and managing IR-controlled devices with JSON persistence using IRCode
paragraph=Provides comprehensive device management capabilities for IR-controlled devices. Features include device creation, storage, retrieval, and removal with JSON-based persistence using LittleFS. Supports both single-command and dual-command device types with automatic ID generation and file-based storage system. Uses the IRCode class for structured IR command handling with built-in JSON serialization.
category=Data Storage
url=https://github.com/madhukartemba/ir_hub
architectures=*
depends=ArduinoJson, LittleFS, IR, IdGen, Log
