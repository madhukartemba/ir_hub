; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps = 
    fastled/FastLED @ ^3.6.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    olikraus/U8g2 @ ^2.36.12
    mathertel/OneButton @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.4.2
    tzapu/WiFiManager @ ^2.0.17
    vintlabs/FauxmoESP @ ^3.4.1
    aircoookie/Espalexa @ ^2.7.0

[env:ir_hub_version_0]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
build_flags = -DUSE_LITTLEFS -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH -DUSE_VERSION_0

[env:ir_hub_version_1]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
build_flags = -DUSE_LITTLEFS -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH -DUSE_VERSION_1

[env:ir_hub_version_3]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
build_flags = -DUSE_LITTLEFS -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH -DUSE_VERSION_3