; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
; Single source of truth for the firmware version reported to the OTA
; manifest. Bump this and your release tag together.
custom_firmware_version = 1.0.9
build_flags =
    -DFIRMWARE_VERSION=\"${this.custom_firmware_version}\"
lib_deps = 
    crankyoldgit/IRremoteESP8266 @ ^2.9.0
    olikraus/U8g2 @ ^2.36.12
    mathertel/OneButton @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.4.2
    tzapu/WiFiManager @ ^2.0.17
    vintlabs/FauxmoESP @ ^3.4.1
    aircoookie/Espalexa @ ^2.7.0
    knolleary/PubSubClient @ ^2.8
    https://github.com/madhukartemba/NeoRing.git
extra_scripts = pre:scripts/ensure_secrets.py

[env:ir_hub_version_0]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DUSE_LITTLEFS
    -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH
    -DUSE_VERSION_0
    -DOTA_HW_VARIANT=\"v0\"
    ; -DMIN_LOG_LEVEL=LOG_LEVEL_DEBUG
    -I include

[env:ir_hub_version_1]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DUSE_LITTLEFS
    -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH
    -DUSE_VERSION_1
    -DOTA_HW_VARIANT=\"v1\"
    ; -DMIN_LOG_LEVEL=LOG_LEVEL_DEBUG
    -I include

[env:ir_hub_version_3]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DUSE_LITTLEFS
    -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH
    -DUSE_VERSION_3
    -DOTA_HW_VARIANT=\"v3\"
    ; -DMIN_LOG_LEVEL=LOG_LEVEL_DEBUG
    -I include
