[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
custom_firmware_version = 1.2.3
build_flags =
    -DFIRMWARE_VERSION=\"${this.custom_firmware_version}\"
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
    ; LWIP2_LOW_MEMORY shrinks the IGMP/UDP buffers enough that SSDP M-SEARCH
    ; packets (Alexa discovery) are silently dropped under load — any
    ; concurrent MQTT/OTA/IR/display work fills the queue and the multicast
    ; packet is lost. HIGHER_BANDWIDTH costs ~3 KB of static heap but is what
    ; Espalexa / emulated-Hue setups need to stay discoverable reliably.
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
lib_deps = 
    crankyoldgit/IRremoteESP8266 @ ^2.9.0
    olikraus/U8g2 @ ^2.36.12
    mathertel/OneButton @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.4.2
    tzapu/WiFiManager @ ^2.0.17
    ; Espalexa is vendored under `lib/Espalexa/` so we can ship two patches
    ; the upstream library does not have:
    ;   - stable per-device Hue uniqueids (caller-supplied, not array index)
    ;   - real LOM001 modelid for `onoff` devices
    ; PIO picks lib/ over lib_deps automatically, so the registry entry is
    ; removed to avoid two copies floating around. See lib/Espalexa/IRHUB_PATCHES.md.
    knolleary/PubSubClient @ ^2.8
    ricmoo/QRCode @ ^0.0.1
    https://github.com/madhukartemba/NeoRing.git
    ; NeoRing's library.json declares FastLED with no version constraint, so
    ; PlatformIO auto-pulls the latest. FastLED 3.10.x (Jun 2025+) introduced
    ; namespace and timing reworks that cause visibly choppy WS2812B animation
    ; on ESP8266 + WiFi (v0 and v1 PCBs both regressed). Pin to 3.9.20 — the
    ; last 3.9.x release — which is what we were transitively building against
    ; through 1.2.0 and which both PCBs run smoothly on. Project-level pins
    ; override transitive deps in PIO.
    fastled/FastLED @ 3.9.20
extra_scripts = pre:scripts/ensure_secrets.py

[env:ir_hub_version_0]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DUSE_LITTLEFS
    -DUSE_VERSION_0
    -DOTA_HW_VARIANT=\"v0\"
    ; -DMIN_LOG_LEVEL=LOG_LEVEL_DEBUG
    -I include

[env:ir_hub_version_1]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DUSE_LITTLEFS
    -DUSE_VERSION_1
    -DOTA_HW_VARIANT=\"v1\"
    ; -DMIN_LOG_LEVEL=LOG_LEVEL_DEBUG
    -I include

[env:ir_hub_version_3]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DUSE_LITTLEFS
    -DUSE_VERSION_3
    -DOTA_HW_VARIANT=\"v3\"
    ; -DMIN_LOG_LEVEL=LOG_LEVEL_DEBUG
    -I include
